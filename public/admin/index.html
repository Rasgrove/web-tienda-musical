<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador - Instrum</title>
    <!-- Widget de Identidad de Netlify -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- El script de Decap CMS se encarga de todo automáticamente -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      const h = window.h;
      
      const WebpImageControl = window.createClass({
        handleChange: function(e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const max_size = 1200;
              if (width > max_size || height > max_size) {
                 if (width > height) {
                   height = Math.round((height * max_size) / width);
                   width = max_size;
                 } else {
                   width = Math.round((width * max_size) / height);
                   height = max_size;
                 }
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              canvas.toBlob((blob) => {
                const originalName = file.name;
                const lastDot = originalName.lastIndexOf('.');
                const baseName = lastDot !== -1 ? originalName.substring(0, lastDot) : originalName;
                const cleanName = baseName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                const finalName = `${cleanName}-${Date.now()}.webp`;

                const webpFile = new File([blob], finalName, { type: 'image/webp' });

                // Almacenar el asset en el CMS
                this.props.onAddAsset(webpFile);

                // Actualizar el valor del input del formulario del CMS
                this.props.onChange(`/Assets/${finalName}`);
              }, 'image/webp', 0.82);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        },

        render: function() {
          const value = this.props.value;
          const getAsset = this.props.getAsset;
          const previewUrl = value ? getAsset(value) : '';

          return h('div', { className: this.props.classNameWrapper, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
            h('span', { style: { fontSize: '0.9rem', color: '#666', fontStyle: 'italic' } }, 'Selecciona una imagen. Se convertirá automáticamente a WebP y se comprimirá en el navegador.'),
            h('input', {
              type: 'file',
              accept: 'image/*',
              id: this.props.forID,
              onChange: this.handleChange,
              style: { padding: '10px', border: '1px dashed #ccc', borderRadius: '4px', cursor: 'pointer' }
            }),
            value && h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
              h('span', { style: { fontSize: '0.8rem', color: '#999' } }, 'Ruta actual: ' + value),
              h('button', {
                type: 'button',
                onClick: () => this.props.onChange(''),
                style: { backgroundColor: '#e06666', color: '#fff', border: 'none', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer' }
              }, 'Eliminar')
            ),
            previewUrl && h('div', { style: { marginTop: '5px' } },
              h('img', {
                src: previewUrl,
                style: { maxWidth: '240px', borderRadius: '8px', border: '1px solid #ddd', objectFit: 'contain' }
              })
            )
          );
        }
      });

      const WebpImagePreview = window.createClass({
        render: function() {
          const value = this.props.value;
          const getAsset = this.props.getAsset;
          const previewUrl = value ? getAsset(value) : '';
          return previewUrl ? h('img', { src: previewUrl, style: { maxWidth: '100%' } }) : null;
        }
      });

      window.CMS.registerWidget('webp-image', WebpImageControl, WebpImagePreview);
    </script>
  </body>
</html>
